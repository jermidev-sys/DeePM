<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeePM - Private Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-deep:#080808;
  --glass-bg:rgba(255,255,255,0.08); 
  --glass-border:rgba(255,255,255,0.15);
  --glass-shine:rgba(255,255,255,0.22);
  --silver:#c8c8c8;
  --silver-dim:#888;
  --silver-bright:#e8e8e8;
  --text-primary:#f0f0f0;
  --text-secondary:#888;
  --gradient-bg:linear-gradient(160deg,#1a1a1a 0%,#0d0d0d 40%,#050505 70%,#111 100%);
}
html,body{height:100%;overflow:hidden;background:var(--bg-deep)}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);display:flex;flex-direction:column;align-items:center;justify-content:center}
#app{width:100%;max-width:430px;height:100dvh;background:var(--gradient-bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb1{width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent);top:-60px;right:-60px}
.orb2{width:220px;height:220px;background:radial-gradient(circle,rgba(150,150,150,0.1),transparent);bottom:100px;left:-40px}
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(40px) saturate(200%); 
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid var(--glass-border);
  border-top-color:var(--glass-shine);
  box-shadow:0 12px 40px rgba(0,0,0,0.5);
}
#header{padding:52px 20px 16px;display:flex;align-items:center;justify-content:center;z-index:10;position:relative}
.logo{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 0%,#888 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#tabs{display:flex;gap:4px;margin:0 20px 16px;padding:4px;border-radius:14px;z-index:10;position:relative;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08)}
.tab{flex:1;padding:10px 0;border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px;transition:all .3s ease}
.tab.active{background:rgba(255,255,255,0.12);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
#views{flex:1;overflow:hidden;position:relative;z-index:5}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 20px 140px;display:none;scrollbar-width:none}
.view.active{display:block}
#player-view{display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px 20px;height:100%;overflow:hidden;}
#player-view.active{display:flex}
.np-art-wrap{width:100%;max-width:clamp(200px, 55vw, 300px);aspect-ratio:1;border-radius:28px;overflow:hidden;margin:0 auto clamp(10px, 3vh, 24px);position:relative;flex-shrink:0}
.np-art-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.np-art-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#222,#111);display:flex;align-items:center;justify-content:center}
.np-art-placeholder svg{width:64px;height:64px;opacity:0.3;fill:none;stroke:#fff;stroke-width:1.5}
.np-info{width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:clamp(10px, 3vh, 25px);text-align:center}
.np-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px}
.np-artist{font-size:15px;color:var(--text-secondary)}
.progress-wrap{width:100%;margin-bottom:clamp(10px, 3vh, 20px)}
.progress-bar{width:100%;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;cursor:pointer;position:relative}
.progress-fill{height:100%;background:#fff;border-radius:3px;position:relative;box-shadow:0 0 10px rgba(255,255,255,0.3)}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:8px}
.controls{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:clamp(5px, 2vh, 15px)}
.ctrl-btn{width:48px;height:48px;border:none;background:transparent;color:var(--silver-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color 0.3s}
.ctrl-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.play-btn{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(255,255,255,0.15)}
.play-btn svg{width:28px;height:28px;fill:currentColor}
.track-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;margin-bottom:8px;transition:0.2s}
.track-item.playing{background:rgba(255,255,255,0.1)}
.track-thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
.track-thumb img{width:100%;height:100%;object-fit:cover}
.track-thumb svg{width:24px;height:24px;stroke:#444;fill:none;stroke-width:1.5}
#mini-player{position:absolute;bottom:0;left:0;right:0;z-index:100;padding:10px 16px 30px;transition:opacity 0.3s}
.mini-inner{border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.mini-art{width:44px;height:44px;border-radius:10px;overflow:hidden;background:#111}
.mini-info{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-artist{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-play{width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.search-input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;margin:16px 0;outline:none}
.row-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:0.2s}
.row-btn:hover{background:rgba(255,255,255,0.15)}
.row-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.track-info{flex:1;min-width:0}
.track-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div id="header"><span class="logo">DeePM</span></div>
  <div id="tabs">
    <button class="tab active" onclick="switchTab('library',this)">Библиотека</button>
    <button class="tab" onclick="switchTab('browse',this)">Обзор</button>
  </div>
  <div id="views">
    <div class="view active" id="library-view">
      <div style="position:relative">
        <svg style="position:absolute;left:15px;top:33px;width:16px;height:16px;stroke:var(--text-secondary);fill:none;stroke-width:2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" placeholder="Поиск по коллекции..." oninput="filterTracks(this.value)">
      </div>
      <p style="font-size:18px; font-weight:700; margin-bottom:15px; font-family:'Syne'">Моя Коллекция</p>
      <div id="track-list"></div>
    </div>
    <div class="view" id="browse-view">
      <div style="position:relative">
        <svg style="position:absolute;left:15px;top:33px;width:16px;height:16px;stroke:var(--text-secondary);fill:none;stroke-width:2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="sc-search" placeholder="Поиск треков..." oninput="scSearchDebounced(this.value)">
      </div>
      <div id="sc-status" style="font-size:13px;color:var(--text-secondary);margin:10px 0"></div>
      <div id="sc-list"></div>
    </div>
    <div class="view" id="player-view">
      <div class="np-art-wrap glass">
        <div class="np-art-placeholder" id="np-placeholder"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <img id="np-img" style="display:none">
      </div>
      <div class="np-info">
        <div class="np-title" id="np-title">Не выбрано</div>
        <div class="np-artist" id="np-artist">Выберите трек</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" onclick="seekTo(event)">
          <div class="progress-fill" id="prog-fill" style="width:0%"></div>
        </div>
        <div class="time-row"><span id="time-cur">0:00</span><span id="time-tot">0:00</span></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="toggleShuffle()" id="shuffle-btn"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/></svg></button>
        <button class="ctrl-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
        <button class="play-btn" onclick="togglePlay()"><svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
        <button class="ctrl-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
        <button class="ctrl-btn" onclick="toggleRepeat()" id="repeat-btn"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/></svg></button>
      </div>
    </div>
  </div>
  <div id="mini-player" onclick="openPlayer()">
    <div class="mini-inner glass">
      <div class="mini-art" id="mini-art"></div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">Не выбрано</div>
        <div class="mini-artist" id="mini-artist">DeePM</div>
      </div>
      <button class="mini-play" onclick="event.stopPropagation();togglePlay()">
        <svg id="mini-play-icon" viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
const audio = new Audio();
let currentIdx = -1, isPlaying = false, isShuffle = false, isRepeat = false;
let currentList = [];

// SoundCloud API v2. Получите client_id из DevTools на soundcloud.com
// (Network -> любой запрос к api-v2.soundcloud.com -> параметр client_id)
const SC_CLIENT_ID = "jEFGoP9keUaPecfq0yoP321bUoawy2LC";
let scResults = [];
let scSearchTimer = null;

const LIBRARY_KEY = 'deepm_library_v1';
let library = loadLibrary();
function loadLibrary(){
  try { return JSON.parse(localStorage.getItem(LIBRARY_KEY) || '[]'); } catch(e){ return []; }
}
function saveLibrary(){ localStorage.setItem(LIBRARY_KEY, JSON.stringify(library)); }

let libraryFilter = '';
function filterTracks(query) { renderLibrary(query); }
function fmt(s){
  if(!s||isNaN(s)) return '0:00';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => togglePlay());
  navigator.mediaSession.setActionHandler('pause', () => togglePlay());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffle-btn').style.color = isShuffle ? '#fff' : 'var(--silver-dim)';
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  const btn = document.getElementById('repeat-btn');
  btn.style.color = isRepeat ? '#fff' : 'var(--silver-dim)';
  audio.loop = isRepeat;
}

function renderLibrary(filter){
  if (filter !== undefined) libraryFilter = filter;
  const list = document.getElementById('track-list');
  const f = libraryFilter.toLowerCase();
  const filtered = library.map((t, i) => ({t, i})).filter(({t}) => !f || (t.title||'').toLowerCase().includes(f) || (t.artist||'').toLowerCase().includes(f));
  if (!library.length) {
    list.innerHTML = '<div class="empty-state">Библиотека пуста.<br>Перейдите во вкладку <b>Обзор</b> и добавьте треки.</div>';
    return;
  }
  list.innerHTML = filtered.map(({t, i}) => {
    const isPlaying = i === currentIdx && currentList === library;
    const cover = t.cover ? `<img src="${escapeHtml(t.cover)}">` : '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    return `<div class="track-item ${isPlaying ? 'playing' : ''}" onclick="playLibrary(${i})">
        <div class="track-thumb">${cover}</div>
        <div class="track-info"><div class="track-title">${escapeHtml(t.title)}</div><div class="track-artist">${escapeHtml(t.artist||'')}</div></div>
        <button class="row-btn" onclick="event.stopPropagation();removeFromLibrary(${i})" title="Удалить"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>`;
  }).join('');
}
function addToLibrary(scIndex){
  const sc = scResults[scIndex];
  if (!sc) return;
  const exists = library.some(t => t.scId && t.scId === sc.scId);
  if (exists) return;
  library.push({
    scId: sc.scId,
    title: sc.title,
    artist: sc.artist,
    cover: sc.cover,
    transcodings: sc.transcodings
  });
  saveLibrary();
  renderLibrary();
  renderScResults();
}
function removeFromLibrary(idx){
  if (currentList === library && currentIdx === idx) {
    audio.pause();
    isPlaying = false;
    currentIdx = -1;
    updateUI();
  } else if (currentList === library && currentIdx > idx) {
    currentIdx--;
  }
  library.splice(idx, 1);
  saveLibrary();
  renderLibrary();
  renderScResults();
}

function renderScResults(){
  const list = document.getElementById('sc-list');
  if (!list) return;
  list.innerHTML = scResults.map((t, i) => {
    const isPlaying = i === currentIdx && currentList === scResults;
    const inLib = library.some(l => l.scId && l.scId === t.scId);
    const cover = t.cover ? `<img src="${escapeHtml(t.cover)}">` : '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    const btn = inLib
      ? `<button class="row-btn" disabled title="Уже в библиотеке" style="opacity:0.5"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>`
      : `<button class="row-btn" onclick="event.stopPropagation();addToLibrary(${i})" title="Добавить в библиотеку"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`;
    return `<div class="track-item ${isPlaying ? 'playing' : ''}" onclick="scPlay(${i})">
        <div class="track-thumb">${cover}</div>
        <div class="track-info"><div class="track-title">${escapeHtml(t.title)}</div><div class="track-artist">${escapeHtml(t.artist || '')}</div></div>
        ${btn}
      </div>`;
  }).join('');
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function scSearchDebounced(q){
  clearTimeout(scSearchTimer);
  scSearchTimer = setTimeout(() => scSearch(q), 400);
}

async function scSearch(query){
  const status = document.getElementById('sc-status');
  if (!query || !query.trim()) { scResults = []; renderScResults(); status.textContent = ''; return; }
  if (!SC_CLIENT_ID) { status.textContent = 'Не задан SC_CLIENT_ID. Откройте index.html и впишите client_id.'; return; }
  status.textContent = 'Поиск...';
  try {
    const r = await fetch(`/api/sc?path=search/tracks&q=${encodeURIComponent(query)}&client_id=${SC_CLIENT_ID}&limit=20`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    scResults = (data.collection || []).filter(t => t.media && t.media.transcodings && t.media.transcodings.length).map(t => ({
      scId: t.id,
      title: t.title,
      artist: t.user && t.user.username,
      cover: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : (t.user && t.user.avatar_url),
      transcodings: t.media.transcodings,
      src: null
    }));
    status.textContent = scResults.length ? '' : 'Ничего не найдено';
    renderScResults();
  } catch (e) {
    status.textContent = 'Ошибка: ' + e.message + '. Возможно, истёк client_id.';
  }
}

async function resolveStream(t, statusEl){
  if (!t.transcodings || !t.transcodings.length) throw new Error('Нет доступных потоков');
  const tr = t.transcodings.find(x => x.format && x.format.protocol === 'progressive') || t.transcodings[0];
  const trPath = tr.url.replace('https://api-v2.soundcloud.com/', '');
  if (statusEl) statusEl.textContent = 'Загрузка потока...';
  const r = await fetch(`/api/sc?path=${encodeURIComponent(trPath)}&client_id=${SC_CLIENT_ID}`);
  const j = await r.json();
  if (statusEl) statusEl.textContent = '';
  return j.url;
}
async function scPlay(i){
  const t = scResults[i];
  if (!t) return;
  try {
    if (!t.src) t.src = await resolveStream(t, document.getElementById('sc-status'));
  } catch (e) {
    document.getElementById('sc-status').textContent = 'Ошибка: ' + e.message;
    return;
  }
  playTrack(i, scResults);
}
async function playLibrary(i){
  const t = library[i];
  if (!t) return;
  try {
    if (!t.src) t.src = await resolveStream(t, null);
  } catch (e) {
    console.error(e);
    return;
  }
  playTrack(i, library);
}

function playTrack(idx, list){
  if (list) currentList = list;
  if (!currentList || !currentList[idx]) return;
  currentIdx = idx;
  const t = currentList[idx];
  audio.src = t.src;
  audio.play().catch(e => console.warn('play error', e));
  isPlaying = true;
  updateUI();
  renderLibrary();
  renderScResults();
}

function openPlayer(){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('player-view').classList.add('active');
  document.getElementById('mini-player').style.display = 'none';
}

function togglePlay(){
  if(currentIdx < 0 && library.length > 0) { playLibrary(0); return; }
  if(currentIdx < 0) return;
  if(isPlaying) audio.pause(); else audio.play();
  isPlaying = !isPlaying;
  updateUI();
}

function updateUI(){
  const t = (currentList && currentList[currentIdx]) || {};
  document.getElementById('np-title').textContent = t.title || "Не выбрано";
  document.getElementById('np-artist').textContent = t.artist || "Выберите трек";
  document.getElementById('mini-title').textContent = t.title || "Не выбрано";
  document.getElementById('mini-artist').textContent = t.artist || "DeePM";
  const npImg = document.getElementById('np-img');
  const npPh = document.getElementById('np-placeholder');
  const miniArt = document.getElementById('mini-art');
  if (t.cover) {
    npImg.src = t.cover; npImg.style.display = 'block'; npPh.style.display = 'none';
    miniArt.innerHTML = `<img src="${t.cover}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    npImg.style.display = 'none'; npPh.style.display = 'flex';
    miniArt.innerHTML = '';
  }
  const icon = isPlaying ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' : '<polygon points="5 3 19 12 5 21 5 3"/>';
  document.getElementById('play-icon').innerHTML = icon;
  document.getElementById('mini-play-icon').innerHTML = icon;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || "DeePM",
      artist: t.artist || "Collection",
      album: "DeePM Private",
      artwork: [{ src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }]
    });
    navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
  }
}

function nextTrack(){
  if (!currentList.length) return;
  let next;
  if (isShuffle && currentList.length > 1) {
    do { next = Math.floor(Math.random() * currentList.length); } while (next === currentIdx);
  } else {
    next = currentIdx + 1; if(next >= currentList.length) next = 0;
  }
  jumpInCurrentList(next);
}

function prevTrack(){
  if (!currentList.length) return;
  let prev = currentIdx - 1; if(prev < 0) prev = currentList.length - 1;
  jumpInCurrentList(prev);
}

async function jumpInCurrentList(idx){
  const t = currentList[idx];
  if (!t) return;
  if (!t.src && t.transcodings) {
    try { t.src = await resolveStream(t, null); } catch(e){ console.error(e); return; }
  }
  playTrack(idx, currentList);
}

audio.ontimeupdate = () => {
  const p = (audio.currentTime / audio.duration) * 100;
  document.getElementById('prog-fill').style.width = p + '%';
  document.getElementById('time-cur').textContent = fmt(audio.currentTime);
  document.getElementById('time-tot').textContent = fmt(audio.duration);
};

audio.onended = () => { if(!isRepeat) nextTrack(); };

function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name + '-view').classList.add('active');
  document.getElementById('mini-player').style.display = 'block';
}

function seekTo(e){
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
}

renderLibrary();
